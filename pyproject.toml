[project]
name = "supercode"
version = "0.1.0"
description = "Local, llama.cpp tabanlı agentic coding agent (Kiro CLI benzeri)"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.48.0",
]

[project.scripts]
supercode = "agent.repl:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
